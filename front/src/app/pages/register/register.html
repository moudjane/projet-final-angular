<main class="p-8">
  <div class="mx-auto max-w-md">
    <div class="border-2 border-gray-900 bg-white p-6 font-mono">
      <h1 class="mb-6 text-2xl font-bold">Créer un compte</h1>

      <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block font-bold">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            required
            class="w-full border-2 border-gray-900 p-2 font-mono"
          />
        </div>

        <div>
          <label for="password" class="block font-bold">Mot de passe</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            required
            class="w-full border-2 border-gray-900 p-2 font-mono"
          />
        </div>

        <div>
          <label for="confirmPassword" class="block font-bold">
            Confirmer le mot de passe
          </label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            required
            class="w-full border-2 border-gray-900 p-2 font-mono"
          />
        </div>

        @if (error()) {
          <p class="text-red-500">
            {{ error() }}
          </p>
        }

        @if (successMessage()) {
          <p class="text-green-500">
            {{ successMessage() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="!isValid()"
          class="border-2 border-gray-900 bg-hn-orange px-6 py-2 font-bold text-white hover:bg-orange-500 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          S'inscrire
        </button>

        <a
          routerLink="/login"
          class="text-gray-600 hover:text-hn-orange hover:underline"
        >
          Déjà un compte ?
        </a>
      </form>
    </div>
  </div>
</main>
