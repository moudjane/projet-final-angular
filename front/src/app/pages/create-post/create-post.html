<main class="p-8">
  <div class="mx-auto max-w-3xl">
    <div class="border-2 border-gray-900 bg-white p-6 font-mono">
      <h1 class="mb-6 text-2xl font-bold">Créer un article</h1>

      <form
        [formGroup]="form"
        (ngSubmit)="handleSubmit()"
        class="space-y-6"
        novalidate
      >
        <!-- Title -->
        <div>
          <label for="title" class="mb-2 block font-bold">Titre</label>
          <input
            id="title"
            type="text"
            formControlName="title"
            required
            class="w-full border-2 border-gray-900 p-3 font-mono"
            placeholder="Titre de votre article"
          />
        </div>

        <!-- Content -->
        <div>
          <label for="content" class="mb-2 block font-bold">Contenu</label>
          <textarea
            id="content"
            rows="10"
            formControlName="content"
            required
            class="w-full resize-none border-2 border-gray-900 p-3 font-mono"
            placeholder="Contenu de votre article..."
          ></textarea>
        </div>

        <!-- Error -->
        @if (error()) {
          <p class="text-red-500">{{ error() }}</p>
        }

        <!-- Buttons -->
        <div class="flex items-center justify-between">
          <button
            type="submit"
            class="border-2 border-gray-900 bg-hn-orange px-6 py-2 font-bold text-white hover:bg-orange-500 disabled:opacity-50"
            [disabled]="form.invalid || isSubmitting()"
          >
            Publier
          </button>

          <button
            type="button"
            (click)="router.navigateByUrl('/articles')"
            class="text-gray-600 hover:text-hn-orange"
          >
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
